<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yard Grid Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Your Live Singapore Firebase Database URL
    const FIREBASE_DB_URL = "https://yard-tracker-2ac18-default-rtdb.asia-southeast1.firebasedatabase.app/";

    // Initialize Firebase
    if (!firebase.apps.length && FIREBASE_DB_URL !== "YOUR_DATABASE_URL_HERE") {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
    }

    // Grid Options: X1-X42, TF1-TF7, T1-T4
    const TF_OPTIONS = Array.from({ length: 7 }, (_, i) => `TF${i + 1}`);
    const T_OPTIONS = Array.from({ length: 4 }, (_, i) => `T${i + 1}`);
    const GRID_X_OPTIONS = [
      ...Array.from({ length: 42 }, (_, i) => `X${i + 1}`),
      ...TF_OPTIONS,
      ...T_OPTIONS
    ];

    const P_PARK_OPTIONS = Array.from({ length: 11 }, (_, i) => `P${i + 1}`);
    const DEFAULT_SERVICES = ["120", "192", "194", "CMA", "225"];
    const SIZES = ["20ft", "40ft"];

    // Default X-Grid to P-Park Zone Mappings
    const DEFAULT_GRID_ZONES = [
      { id: 1, start: 1, end: 12, pPark: "P2" },
      { id: 2, start: 13, end: 24, pPark: "P3" },
      { id: 3, start: 25, end: 30, pPark: "P4" },
      { id: 4, start: 31, end: 42, pPark: "P5" }
    ];

    // Default Dedicated Service Grids
    const DEFAULT_DEDICATED_GRIDS = [
      { id: 1, grid: "X37", service: "192", size: "40ft" },
      { id: 2, grid: "X31", service: "192", size: "20ft" },
      { id: 3, grid: "X39", service: "194", size: "40ft" },
      { id: 4, grid: "X41", service: "120", size: "40ft" }
    ];

    // Bay Size & Slot Definitions
    const GRIDS_20FT = new Set([
      "X1", "X7", "X12", "X13", "X18", "X19", "X24", "X25", "X30",
      "X31", "X36", "X37", "X42"
    ]);

    const GRIDS_40FT = new Set([
      "X2", "X3", "X4", "X5",
      "X8", "X9", "X10", "X11",
      "X14", "X15", "X16", "X17",
      "X20", "X21", "X22", "X23",
      "X26", "X27", "X28", "X29",
      "X32", "X33", "X34", "X35",
      "X38", "X39", "X40", "X41"
    ]);

    const GRIDS_INACTIVE = new Set(["X6"]);

    // 7 Vertical Blocks matching spreadsheet map
    const YARD_MAP_BLOCKS = [
      { title: "X1–X6", letters: ["A", "B", "C", "D"], grids: ["X1", "X2", "X3", "X4", "X5", "X6"] },
      { title: "X7–X12", letters: ["A", "B", "C", "D"], grids: ["X7", "X8", "X9", "X10", "X11", "X12"] },
      { title: "X13–X18", letters: ["A", "B", "C", "D"], grids: ["X13", "X14", "X15", "X16", "X17", "X18"] },
      { title: "X19–X24", letters: ["A", "B", "C", "D"], grids: ["X19", "X20", "X21", "X22", "X23", "X24"] },
      { title: "X25–X30", letters: ["A", "B", "C", "D"], grids: ["X25", "X26", "X27", "X28", "X29", "X30"] },
      { title: "X31–X36", letters: ["A", "B", "C", "D", "E", "F", "G", "H", "I"], grids: ["X31", "X32", "X33", "X34", "X35", "X36"] },
      { title: "X37–X42", letters: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"], grids: ["X37", "X38", "X39", "X40", "X41", "X42"] }
    ];

    const getGridSlotInfo = (gridStr) => {
      if (!gridStr) return null;
      const g = gridStr.trim().toUpperCase();
      if (GRIDS_INACTIVE.has(g)) {
        return { baySize: "INACTIVE", slots: "Blocked / Inactive" };
      }
      const match = g.match(/^X(\d+)$/);
      if (!match) return null;
      const num = parseInt(match[1], 10);

      let slots = "A–D";
      if (num === 4 || num === 5) {
        slots = "B–D (A blocked)";
      } else if (num >= 31 && num <= 36) {
        slots = "A–I";
      } else if (num >= 37 && num <= 42) {
        slots = "A–J";
      }

      if (GRIDS_20FT.has(g)) return { baySize: "20ft", slots };
      if (GRIDS_40FT.has(g)) return { baySize: "40ft", slots };
      return null;
    };

    const INITIAL_ROWS = Array.from({ length: 12 }, (_, index) => ({
      id: index + 1,
      service: "",
      size: "",
      grid: "",
      pPark: "",
      lastUpdated: "",
      overridden: false,
      sharedGridOverridden: false,
      trainBlocked: false,
      tempGrid: "N/A"
    }));

    const getAssignedPPark = (gridStr, zones) => {
      if (!gridStr) return null;
      const match = gridStr.trim().toUpperCase().match(/^X(\d+)$/);
      if (!match) return null;
      const num = parseInt(match[1], 10);
      const zone = zones.find(z => num >= Number(z.start) && num <= Number(z.end));
      return zone ? zone.pPark : null;
    };

    const getBlockPParkSegments = (grids, zones) => {
      const segments = [];
      grids.forEach((gCode) => {
        const num = parseInt(gCode.replace("X", ""), 10);
        const pPark = getAssignedPPark(gCode, zones) || "--";
        const last = segments[segments.length - 1];
        if (last && last.pPark === pPark && last.endNum === num - 1) {
          last.endNum = num;
        } else {
          segments.push({ pPark, startNum: num, endNum: num });
        }
      });
      return segments;
    };

    const evaluateRowGridStatus = (row, dedicatedGrids) => {
      if (!row.grid && !row.trainBlocked) return null;
      const g = (row.grid || "").trim().toUpperCase();
      const slotInfo = getGridSlotInfo(g);
      const dedicatedRule = dedicatedGrids.find(d => d.grid.trim().toUpperCase() === g);

      const issues = [];

      if (row.trainBlocked) {
        issues.push(`🛑 Grid blocked for train load-out`);
      }

      if (slotInfo && slotInfo.baySize === "INACTIVE") {
        issues.push(`${g} is inactive/blocked on yard map`);
      }

      if (dedicatedRule) {
        const svcMismatch = row.service && dedicatedRule.service && row.service !== dedicatedRule.service;
        const sizeMismatch = row.size && dedicatedRule.size && row.size !== dedicatedRule.size;
        if (svcMismatch || sizeMismatch) {
          const expectedParts = [dedicatedRule.service, dedicatedRule.size].filter(Boolean).join(" ");
          issues.push(`Dedicated to ${expectedParts}`);
        }
      }

      if (slotInfo && (slotInfo.baySize === "20ft" || slotInfo.baySize === "40ft")) {
        if (row.size && row.size !== slotInfo.baySize) {
          const sizeMsg = `Grid cannot be used for ${row.size} (${slotInfo.baySize} bay)`;
          if (!issues.some(msg => msg.includes(dedicatedRule?.size))) {
            issues.push(sizeMsg);
          }
        }
      }

      return {
        slotInfo,
        dedicatedRule,
        issues,
        hasConflict: issues.length > 0 || row.trainBlocked
      };
    };

    const formatTo24Hour = (timeStr) => {
      if (!timeStr) return "--";
      if (/^[A-Za-z]{3}\s+\d{1,2},\s+\d{4}$/.test(timeStr)) return timeStr;
      
      const legacyMatch = timeStr.match(/^([A-Za-z]+\s+\d+),\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (legacyMatch) {
        const [, datePart, rawH, min, ampm] = legacyMatch;
        let h = parseInt(rawH, 10);
        if (ampm.toUpperCase() === "PM" && h < 12) h += 12;
        if (ampm.toUpperCase() === "AM" && h === 12) h = 0;
        return `${datePart}, ${String(h).padStart(2, "0")}${min}`;
      }

      const parsedDate = new Date(timeStr);
      if (!isNaN(parsedDate.getTime())) {
        const month = parsedDate.toLocaleString("en-US", { month: "short" });
        const day = parsedDate.getDate();
        const hours = String(parsedDate.getHours()).padStart(2, "0");
        const minutes = String(parsedDate.getMinutes()).padStart(2, "0");
        return `${month} ${day}, ${hours}${minutes}`;
      }

      return timeStr;
    };

    const getCurrent24HourTimestamp = () => {
      const now = new Date();
      const month = now.toLocaleString("en-US", { month: "short" });
      const day = now.getDate();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      return `${month} ${day}, ${hours}${minutes}`;
    };

    const formatServiceAndSize = (service, size) => {
      const svcText = service ? `Service ${service}` : "Unassigned Service";
      return size ? `${svcText} (${size})` : svcText;
    };

    function XGridMapBoard({ onClose, gridZones }) {
      return (
        <div className="bg-slate-950/95 backdrop-blur-md border border-slate-700/90 rounded-2xl shadow-2xl p-4 w-full overflow-x-auto">
          <div className="flex flex-wrap items-center justify-between gap-3 pb-3 mb-3.5 border-b border-slate-800/90">
            <div className="flex flex-wrap items-center gap-4 text-xs">
              <span className="font-bold text-white uppercase tracking-wider flex items-center gap-1.5">
                <span className="text-blue-400">🗺️</span> X Grid Map Reference
              </span>
              <span className="inline-flex items-center gap-1.5 text-amber-300 font-medium">
                <span className="w-3.5 h-3.5 rounded-[3px] bg-gradient-to-b from-amber-300 to-amber-400 border border-amber-500/80 shadow-sm inline-block"></span>
                20ft Bay
              </span>
              <span className="inline-flex items-center gap-1.5 text-emerald-300 font-medium">
                <span className="w-3.5 h-3.5 rounded-[3px] bg-gradient-to-b from-emerald-400 to-emerald-500 border border-emerald-300/70 shadow-sm inline-block"></span>
                40ft Bay
              </span>
              <span className="inline-flex items-center gap-1.5 text-slate-300 font-medium">
                <span className="w-3.5 h-3.5 rounded-[3px] bg-white/95 border border-slate-400 inline-block"></span>
                Blocked Slot
              </span>
              <span className="inline-flex items-center gap-1.5 text-slate-500 font-medium">
                <span className="w-3.5 h-3.5 rounded-[3px] bg-slate-900 border border-slate-800 inline-block"></span>
                Inactive
              </span>
            </div>

            <button
              type="button"
              onClick={onClose}
              className="text-slate-400 hover:text-white text-xs bg-slate-800/90 hover:bg-slate-700 px-2.5 py-1 rounded-lg border border-slate-700 transition"
            >
              ✕ Close
            </button>
          </div>

          <div className="flex items-stretch justify-between gap-3.5 pb-1 min-w-max">
            {YARD_MAP_BLOCKS.map((block) => {
              const pParkSegments = getBlockPParkSegments(block.grids, gridZones);

              return (
                <div key={block.title} className="bg-slate-900/80 border border-slate-800 rounded-xl p-2 shadow-inner flex flex-col justify-between">
                  <div>
                    <div className="flex items-center mb-1.5">
                      <div className="w-9 shrink-0"></div>
                      <div className="flex gap-1">
                        {block.letters.map((letter) => (
                          <div key={letter} className="w-4 text-center text-[10px] font-bold text-slate-400 tracking-wide">
                            {letter}
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {block.grids.map((gCode) => {
                        const is20 = GRIDS_20FT.has(gCode);
                        const isInactive = GRIDS_INACTIVE.has(gCode);

                        return (
                          <div key={gCode} className="w-full flex items-center rounded-md px-1 py-0.5 hover:bg-slate-800/40">
                            <span className="w-8 shrink-0 text-left text-[11px] font-bold font-mono text-slate-300">
                              {gCode}
                            </span>

                            {isInactive ? (
                              <div style={{ width: `${block.letters.length * 20 - 4}px` }} className="h-4 bg-slate-950 border border-slate-800/90 rounded-[3px]" />
                            ) : (
                              <div className="flex gap-1">
                                {block.letters.map((letter) => {
                                  const isBlockedSlotA = (gCode === "X4" || gCode === "X5") && letter === "A";
                                  if (isBlockedSlotA) {
                                    return <div key={letter} className="w-4 h-4 bg-white/95 border border-slate-400 rounded-[3px] shadow-sm" />;
                                  }
                                  return (
                                    <div
                                      key={letter}
                                      className={`w-4 h-4 rounded-[3px] border shadow-sm ${
                                        is20
                                          ? "bg-gradient-to-b from-amber-300 to-amber-400 border-amber-500/80"
                                          : "bg-gradient-to-b from-emerald-400 to-emerald-500 border-emerald-300/70"
                                      }`}
                                    />
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="mt-2.5 pt-1.5 border-t border-slate-800/90 flex items-center gap-1">
                    {pParkSegments.map((seg, idx) => (
                      <div
                        key={`${seg.pPark}-${idx}`}
                        style={{ flexGrow: seg.endNum - seg.startNum + 1 }}
                        className="text-center text-[10px] font-bold tracking-wide px-1.5 py-0.5 rounded-md bg-purple-500/15 text-purple-300 border border-purple-500/30 truncate"
                      >
                        {seg.pPark}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("tracker");
      const [rows, setRows] = useState(INITIAL_ROWS);
      const [services, setServices] = useState(DEFAULT_SERVICES);
      const [gridZones, setGridZones] = useState(DEFAULT_GRID_ZONES);
      const [dedicatedGrids, setDedicatedGrids] = useState(DEFAULT_DEDICATED_GRIDS);
      const [history, setHistory] = useState([]);
      const [isSynced, setIsSynced] = useState(false);

      const [selectedServiceFilters, setSelectedServiceFilters] = useState([]);
      const [showFilterDropdown, setShowFilterDropdown] = useState(false);
      const [showHeaderGridMap, setShowHeaderGridMap] = useState(false);
      const [openActionRowId, setOpenActionRowId] = useState(null);

      // Train Block Modal State
      const [trainBlockModalRow, setTrainBlockModalRow] = useState(null);
      const [tempGridInput, setTempGridInput] = useState("N/A");

      const [isRemoveMode, setIsRemoveMode] = useState(false);
      const [rowPendingRemoval, setRowPendingRemoval] = useState(null);
      const [sharedGridConflict, setSharedGridConflict] = useState(null);
      const committedRowsSnapshotRef = useRef(INITIAL_ROWS);

      const [notificationText, setNotificationText] = useState("");
      const [showNotificationEditor, setShowNotificationEditor] = useState(false);
      const [notificationInput, setNotificationInput] = useState("");

      const [showExportDrawer, setShowExportDrawer] = useState(false);
      const [selectedServicesForExport, setSelectedServicesForExport] = useState([]);

      const [draggedIndex, setDraggedIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      const [showControlsMenu, setShowControlsMenu] = useState(false);
      const [showManageServices, setShowManageServices] = useState(false);
      const [showManageZones, setShowManageZones] = useState(false);
      const [showManageDedicated, setShowManageDedicated] = useState(false);
      const [newServiceInput, setNewServiceInput] = useState("");
      const [editingServiceIndex, setEditingServiceIndex] = useState(null);
      const [editServiceInput, setEditServiceInput] = useState("");

      const [logSearchQuery, setLogSearchQuery] = useState("");

      const dropdownRef = useRef(null);
      const filterDropdownRef = useRef(null);
      const actionMenuRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setShowControlsMenu(false);
          if (filterDropdownRef.current && !filterDropdownRef.current.contains(event.target)) setShowFilterDropdown(false);
          if (actionMenuRef.current && !actionMenuRef.current.contains(event.target)) setOpenActionRowId(null);
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      useEffect(() => {
        if (!FIREBASE_DB_URL) return;
        const db = firebase.database();

        const rowsRef = db.ref("yard_rows");
        rowsRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setRows(data);
            committedRowsSnapshotRef.current = data;
          }
          setIsSynced(true);
        });

        const servicesRef = db.ref("yard_services");
        servicesRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setServices(data);
        });

        const zonesRef = db.ref("yard_grid_zones");
        zonesRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data && Array.isArray(data)) setGridZones(data);
        });

        const dedicatedRef = db.ref("yard_dedicated_grids");
        dedicatedRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data && Array.isArray(data)) setDedicatedGrids(data);
        });

        const historyRef = db.ref("yard_history");
        historyRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setHistory(Object.values(data).reverse());
        });

        const notificationRef = db.ref("yard_notification");
        notificationRef.on("value", (snapshot) => {
          setNotificationText(snapshot.val() || "");
        });

        return () => {
          rowsRef.off();
          servicesRef.off();
          zonesRef.off();
          dedicatedRef.off();
          historyRef.off();
          notificationRef.off();
        };
      }, []);

      const saveRowsToFirebase = (newRows) => {
        const reindexedRows = newRows.map((r, i) => ({ ...r, id: i + 1 }));
        setRows(reindexedRows);
        committedRowsSnapshotRef.current = reindexedRows;
        firebase.database().ref("yard_rows").set(reindexedRows);
      };

      const saveGridZonesToFirebase = (updatedZones) => {
        setGridZones(updatedZones);
        firebase.database().ref("yard_grid_zones").set(updatedZones);
      };

      const saveDedicatedGridsToFirebase = (updatedDedicated) => {
        setDedicatedGrids(updatedDedicated);
        firebase.database().ref("yard_dedicated_grids").set(updatedDedicated);
      };

      const handleRowInputChange = (id, field, value) => {
        const formattedValue = (field === "grid" || field === "pPark") ? value.toUpperCase() : value;
        const updatedRows = rows.map(row => {
          if (row.id !== id) return row;
          const resetOverride = (field === "grid" || field === "service" || field === "size") ? false : row.overridden;
          if (field === "grid") {
            const autoPPark = getAssignedPPark(formattedValue, gridZones);
            return {
              ...row,
              grid: formattedValue,
              pPark: autoPPark !== null ? autoPPark : row.pPark,
              overridden: resetOverride
            };
          }
          return { ...row, [field]: formattedValue, overridden: resetOverride };
        });
        setRows(updatedRows);
      };

      const finalizeRowCommit = (id, field, formattedValue, markSharedGridOverridden = false) => {
        const now = getCurrent24HourTimestamp();
        const baselineRows = committedRowsSnapshotRef.current;
        const currentRow = baselineRows.find(r => r.id === id) || rows.find(r => r.id === id);
        if (!currentRow) return;

        let resolvedPPark = currentRow.pPark || "";
        if (field === "grid") {
          const autoPPark = getAssignedPPark(formattedValue, gridZones);
          if (autoPPark !== null) {
            resolvedPPark = autoPPark;
          }
        } else if (field === "pPark") {
          resolvedPPark = formattedValue;
        }

        const updatedRows = baselineRows.map(row => {
          if (row.id === id) {
            const fieldChanged = row[field] !== formattedValue;
            const shouldResetOverride = (field === "service" || field === "size" || field === "grid")
              ? (fieldChanged ? false : row.overridden)
              : row.overridden;

            const nextSharedOverride = markSharedGridOverridden
              ? true
              : (field === "service" || field === "grid")
              ? (fieldChanged ? false : Boolean(row.sharedGridOverridden))
              : Boolean(row.sharedGridOverridden);

            return {
              ...row,
              [field]: formattedValue,
              pPark: resolvedPPark,
              lastUpdated: now,
              overridden: shouldResetOverride,
              sharedGridOverridden: nextSharedOverride
            };
          }
          return row;
        });

        saveRowsToFirebase(updatedRows);

        if (field === "service" || field === "size" || field === "grid") {
          const logEntry = {
            id: Date.now(),
            timestamp: now,
            service: field === "service" ? formattedValue : currentRow.service,
            size: field === "size" ? formattedValue : currentRow.size,
            grid: field === "grid" ? formattedValue : currentRow.grid,
            action: markSharedGridOverridden
              ? `Updated Line ${id} ${field.toUpperCase()} to ${formattedValue || "Empty"} (Shared Grid Overridden)`
              : `Updated Line ${id} ${field.toUpperCase()} to ${formattedValue || "Empty"}`
          };

          firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);
        }
      };

      const handleCommitRowChange = (id, field, value) => {
        const formattedValue = (field === "grid" || field === "pPark") ? value.toUpperCase().trim() : value;
        const baselineRows = committedRowsSnapshotRef.current;
        const currentRow = baselineRows.find(r => r.id === id);
        if (!currentRow) return;

        if (field === "grid" || field === "service") {
          const candidateGrid = (field === "grid" ? formattedValue : (currentRow.grid || "")).trim().toUpperCase();
          const candidateService = (field === "service" ? formattedValue : (currentRow.service || "")).trim();
          const candidateSize = currentRow.size || "";

          const isSameAsCommitted = currentRow[field] === formattedValue;

          if (candidateGrid && candidateService && (!isSameAsCommitted || !currentRow.sharedGridOverridden)) {
            const conflictingRows = baselineRows.filter(other => {
              if (other.id === id) return false;
              const otherGrid = (other.grid || "").trim().toUpperCase();
              const otherService = (other.service || "").trim();
              return otherGrid === candidateGrid && otherService !== "" && otherService !== candidateService;
            });

            if (conflictingRows.length > 0) {
              const uniqueExisting = [];
              const seenKeys = new Set();
              conflictingRows.forEach(r => {
                const label = formatServiceAndSize(r.service, r.size);
                if (!seenKeys.has(label)) {
                  seenKeys.add(label);
                  uniqueExisting.push(label);
                }
              });

              setSharedGridConflict({
                rowId: id,
                field,
                newValue: formattedValue,
                grid: candidateGrid,
                incomingLabel: formatServiceAndSize(candidateService, candidateSize),
                existingLabels: uniqueExisting
              });
              return;
            }
          }
        }

        finalizeRowCommit(id, field, formattedValue, false);
      };

      const handleConfirmSharedGridOverride = () => {
        if (!sharedGridConflict) return;
        const { rowId, field, newValue } = sharedGridConflict;
        setSharedGridConflict(null);
        finalizeRowCommit(rowId, field, newValue, true);
      };

      const handleCancelSharedGridConflict = () => {
        setSharedGridConflict(null);
        setRows([...committedRowsSnapshotRef.current]);
      };

      // Click action for Train Block: Opens modal if unblocking or blocking
      const handleOpenTrainBlockModal = (row) => {
        setOpenActionRowId(null);
        if (row.trainBlocked) {
          // If already blocked, clicking unblocks immediately
          executeToggleTrainBlock(row.id, false, "N/A");
        } else {
          // Open modal to configure temp alternate grid
          setTrainBlockModalRow(row);
          setTempGridInput("N/A");
        }
      };

      const executeToggleTrainBlock = (id, blockState, tempGridVal) => {
        const now = getCurrent24HourTimestamp();
        const targetRow = rows.find(r => r.id === id);
        if (!targetRow) return;

        const updatedRows = rows.map(row => row.id === id ? {
          ...row,
          trainBlocked: blockState,
          tempGrid: blockState ? (tempGridVal || "N/A") : "N/A",
          lastUpdated: now
        } : row);

        saveRowsToFirebase(updatedRows);
        setTrainBlockModalRow(null);

        const logEntry = {
          id: Date.now(),
          timestamp: now,
          service: targetRow.service,
          size: targetRow.size,
          grid: targetRow.grid,
          action: blockState 
            ? `Blocked Line ${id} Grid for train (Temp: ${tempGridVal || "N/A"})`
            : `Unblocked Line ${id} Grid`
        };
        firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);
      };

      const clearRow = (id) => {
        const rowToClear = rows.find(r => r.id === id);
        if (!rowToClear) return;

        const now = getCurrent24HourTimestamp();
        const updatedRows = rows.map(row => row.id === id ? {
          ...row,
          service: "",
          size: "",
          grid: "",
          pPark: "",
          lastUpdated: now,
          overridden: false,
          sharedGridOverridden: false,
          trainBlocked: false,
          tempGrid: "N/A"
        } : row);
        
        const logEntry = {
          id: Date.now(),
          timestamp: now,
          service: rowToClear.service,
          size: rowToClear.size,
          grid: rowToClear.grid,
          action: `Cleared Line ${id}`
        };

        firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);
        saveRowsToFirebase(updatedRows);
        setOpenActionRowId(null);
      };

      const startRemoveLineMode = () => {
        if (rows.length <= 1) return;
        closeAllDrawers();
        setActiveTab("tracker");
        setIsRemoveMode(true);
        setRowPendingRemoval(null);
        setShowControlsMenu(false);
      };

      const cancelRemoveLineMode = () => {
        setIsRemoveMode(false);
        setRowPendingRemoval(null);
      };

      const handleConfirmRemoveLine = () => {
        if (!rowPendingRemoval || rows.length <= 1) return;
        const targetRow = rowPendingRemoval.row;
        const displayNum = rowPendingRemoval.displayIndex + 1;

        const updatedRows = rows.filter(r => r.id !== targetRow.id);
        saveRowsToFirebase(updatedRows);

        const now = getCurrent24HourTimestamp();
        const detailSummary = [targetRow.service, targetRow.grid].filter(Boolean).join(" / ");
        const logEntry = {
          id: Date.now(),
          timestamp: now,
          service: targetRow.service || "",
          size: targetRow.size || "",
          grid: targetRow.grid || "",
          action: detailSummary
            ? `Removed Line ${displayNum} (${detailSummary})`
            : `Removed Line ${displayNum}`
        };
        firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);

        setRowPendingRemoval(null);
        setIsRemoveMode(false);
      };

      const handleZoneFieldChange = (id, key, val) => {
        const updated = gridZones.map(z => {
          if (z.id !== id) return z;
          if (key === "pPark") return { ...z, pPark: val.toUpperCase() };
          return { ...z, [key]: val === "" ? "" : Math.max(1, Math.min(42, parseInt(val, 10) || 1)) };
        });
        saveGridZonesToFirebase(updated);
      };

      const handleAddZone = () => {
        const nextId = gridZones.length > 0 ? Math.max(...gridZones.map(z => z.id)) + 1 : 1;
        const newZone = { id: nextId, start: 1, end: 1, pPark: "P1" };
        saveGridZonesToFirebase([...gridZones, newZone]);
      };

      const handleDeleteZone = (id) => {
        saveGridZonesToFirebase(gridZones.filter(z => z.id !== id));
      };

      const handleResetZones = () => {
        saveGridZonesToFirebase(DEFAULT_GRID_ZONES);
      };

      const handleDedicatedFieldChange = (id, key, val) => {
        const updated = dedicatedGrids.map(d => {
          if (d.id !== id) return d;
          return { ...d, [key]: key === "grid" ? val.toUpperCase() : val };
        });
        saveDedicatedGridsToFirebase(updated);
      };

      const handleAddDedicated = () => {
        const nextId = dedicatedGrids.length > 0 ? Math.max(...dedicatedGrids.map(d => d.id)) + 1 : 1;
        const newItem = { id: nextId, grid: "X1", service: services[0] || "120", size: "20ft" };
        saveDedicatedGridsToFirebase([...dedicatedGrids, newItem]);
      };

      const handleDeleteDedicated = (id) => {
        saveDedicatedGridsToFirebase(dedicatedGrids.filter(d => d.id !== id));
      };

      const handleResetDedicated = () => {
        saveDedicatedGridsToFirebase(DEFAULT_DEDICATED_GRIDS);
      };

      const closeAllDrawers = () => {
        setShowNotificationEditor(false);
        setShowManageServices(false);
        setShowExportDrawer(false);
        setShowManageZones(false);
        setShowManageDedicated(false);
      };

      const openNotificationEditor = () => {
        closeAllDrawers();
        setNotificationInput(notificationText);
        setShowNotificationEditor(true);
      };

      const handleSaveNotification = (e) => {
        e.preventDefault();
        const text = notificationInput.trim();
        firebase.database().ref("yard_notification").set(text);
        setShowNotificationEditor(false);
      };

      const handleClearNotification = () => {
        firebase.database().ref("yard_notification").set("");
        setNotificationInput("");
      };

      const openExportDrawer = () => {
        closeAllDrawers();
        setSelectedServicesForExport([...services]);
        setShowExportDrawer(true);
      };

      const toggleExportService = (svc) => {
        if (selectedServicesForExport.includes(svc)) {
          setSelectedServicesForExport(selectedServicesForExport.filter(s => s !== svc));
        } else {
          setSelectedServicesForExport([...selectedServicesForExport, svc]);
        }
      };

      const selectAllExportServices = () => setSelectedServicesForExport([...services]);
      const deselectAllExportServices = () => setSelectedServicesForExport([]);

      const handleExecuteExport = () => {
        const rowsToExport = rows.filter(r => r.service && selectedServicesForExport.includes(r.service));

        if (rowsToExport.length === 0) {
          alert("No matching container rows found for the selected service(s).");
          return;
        }

        const exportData = rowsToExport.map((row) => ({
          "Service": row.service || "",
          "Size": row.size || "",
          "Grid": row.grid || "",
          "P Park": row.pPark || ""
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        worksheet["!cols"] = [
          { wch: 14 },
          { wch: 10 },
          { wch: 14 },
          { wch: 14 }
        ];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Yard Grid Export");

        const dateStr = new Date().toISOString().slice(0,10);
        const fileName = `Yard_Grid_Export_${dateStr}.xlsx`;

        XLSX.writeFile(workbook, fileName);
        setShowExportDrawer(false);
      };

      const toggleServiceFilter = (svc) => {
        if (selectedServiceFilters.includes(svc)) {
          setSelectedServiceFilters(selectedServiceFilters.filter(s => s !== svc));
        } else {
          setSelectedServiceFilters([...selectedServiceFilters, svc]);
        }
      };

      const clearServiceFilters = () => {
        setSelectedServiceFilters([]);
      };

      const selectAllServiceFilters = () => {
        setSelectedServiceFilters([...services]);
      };

      const handleDragStart = (index) => {
        if (isRemoveMode || selectedServiceFilters.length > 0) return;
        setDraggedIndex(index);
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        if (isRemoveMode || selectedServiceFilters.length > 0) return;
        if (dragOverIndex !== index) {
          setDragOverIndex(index);
        }
      };

      const handleDrop = (dropIndex) => {
        if (isRemoveMode || selectedServiceFilters.length > 0) return;
        if (draggedIndex === null || draggedIndex === dropIndex) {
          setDraggedIndex(null);
          setDragOverIndex(null);
          return;
        }

        const updatedRows = [...rows];
        const [movedRow] = updatedRows.splice(draggedIndex, 1);
        updatedRows.splice(dropIndex, 0, movedRow);

        saveRowsToFirebase(updatedRows);

        const now = getCurrent24HourTimestamp();
        const logEntry = {
          id: Date.now(),
          timestamp: now,
          service: movedRow.service,
          size: movedRow.size,
          grid: movedRow.grid,
          action: `Reordered Line to position ${dropIndex + 1}`
        };
        firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);

        setDraggedIndex(null);
        setDragOverIndex(null);
      };

      const getPreviewRows = () => {
        if (draggedIndex === null || dragOverIndex === null || draggedIndex === dragOverIndex) {
          return rows;
        }
        const tempRows = [...rows];
        const [draggedRow] = tempRows.splice(draggedIndex, 1);
        tempRows.splice(dragOverIndex, 0, draggedRow);
        return tempRows;
      };

      const displayRows = getPreviewRows();

      const addRow = () => {
        const nextId = rows.length + 1;
        const newRow = {
          id: nextId,
          service: "",
          size: "",
          grid: "",
          pPark: "",
          lastUpdated: "",
          overridden: false,
          sharedGridOverridden: false,
          trainBlocked: false,
          tempGrid: "N/A"
        };
        saveRowsToFirebase([...rows, newRow]);
        setShowControlsMenu(false);
      };

      const handleAddService = (e) => {
        e.preventDefault();
        if (newServiceInput.trim() && !services.includes(newServiceInput.trim())) {
          const updatedServices = [...services, newServiceInput.trim()];
          setServices(updatedServices);
          firebase.database().ref("yard_services").set(updatedServices);
          setNewServiceInput("");
        }
      };

      const handleStartEditService = (index) => {
        setEditingServiceIndex(index);
        setEditServiceInput(services[index]);
      };

      const handleSaveEditService = (index) => {
        const oldName = services[index];
        const newName = editServiceInput.trim();
        if (!newName || newName === oldName) {
          setEditingServiceIndex(null);
          return;
        }

        const updatedServices = [...services];
        updatedServices[index] = newName;
        setServices(updatedServices);

        firebase.database().ref("yard_services").set(updatedServices);
        setEditingServiceIndex(null);
      };

      const handleDeleteService = (index) => {
        const updatedServices = services.filter((_, i) => i !== index);
        setServices(updatedServices);
        firebase.database().ref("yard_services").set(updatedServices);
      };

      const filteredHistory = history.filter(log => {
        if (!logSearchQuery.trim()) return true;
        const q = logSearchQuery.toLowerCase();
        return (
          (log.service && log.service.toLowerCase().includes(q)) ||
          (log.grid && log.grid.toLowerCase().includes(q)) ||
          (log.action && log.action.toLowerCase().includes(q))
        );
      });

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-6 font-sans">
          <datalist id="p-park-list">
            {P_PARK_OPTIONS.map(opt => <option key={opt} value={opt} />)}
          </datalist>

          {/* Train Block Configuration Modal */}
          {trainBlockModalRow && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-amber-500/60 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex items-center gap-2.5 text-amber-400">
                  <span className="text-xl">🛑</span>
                  <h3 className="text-lg font-bold text-white">Block Grid for Train Load-Out</h3>
                </div>

                <div className="space-y-3 text-sm text-slate-300">
                  <p>
                    Line <strong className="text-white">#{trainBlockModalRow.id}</strong> (Grid <strong className="text-emerald-400 font-mono">{trainBlockModalRow.grid || "Unassigned"}</strong>) will be restricted.
                  </p>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
                      Temporary Alternate Grid (Optional):
                    </label>
                    <input
                      type="text"
                      value={tempGridInput}
                      onChange={(e) => setTempGridInput(e.target.value.toUpperCase())}
                      placeholder="e.g. TF3, T1, or N/A"
                      className="w-full bg-slate-900 border border-slate-700 text-white font-mono font-semibold rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none"
                    />
                    <p className="text-[11px] text-slate-500 mt-1">Leave as "N/A" if no temporary alternate spot is required right now.</p>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setTrainBlockModalRow(null)}
                    className="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => executeToggleTrainBlock(trainBlockModalRow.id, true, tempGridInput.trim() || "N/A")}
                    className="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold shadow-lg transition"
                  >
                    Confirm Block
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Sticky Maximized X Grid Map Reference Panel */}
          {showHeaderGridMap && (
            <div className="sticky top-4 z-40 max-w-7xl mx-auto mb-6 shadow-2xl transition-all">
              <XGridMapBoard
                gridZones={gridZones}
                onClose={() => setShowHeaderGridMap(false)}
              />
            </div>
          )}

          {/* Shared Grid Conflict Modal */}
          {sharedGridConflict && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-amber-500/60 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex items-center gap-2.5 text-amber-400">
                  <span className="text-xl">⚠️</span>
                  <h3 className="text-lg font-bold text-white">Grid Already Planned for Another Service</h3>
                </div>

                <div className="space-y-2 text-sm text-slate-300">
                  <p>
                    Grid <strong className="text-white font-mono">{sharedGridConflict.grid}</strong> is currently planned for{" "}
                    <strong className="text-amber-300">{sharedGridConflict.existingLabels.join(", ")}</strong>.
                  </p>
                  <p>
                    Do you want to override and assign <strong className="text-blue-300">{sharedGridConflict.incomingLabel}</strong> here too?
                  </p>
                </div>

                <div className="flex items-center justify-end gap-3 pt-2">
                  <button
                    type="button"
                    onClick={handleCancelSharedGridConflict}
                    className="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmSharedGridOverride}
                    className="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold shadow-lg transition"
                  >
                    Yes, Override
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Remove Line Confirmation Modal */}
          {rowPendingRemoval && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-red-500/50 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex items-center gap-2.5 text-red-400">
                  <span className="text-xl">⚠️</span>
                  <h3 className="text-lg font-bold text-white">Confirm Line Removal</h3>
                </div>

                <p className="text-sm text-slate-300">
                  Are you sure you want to permanently remove <strong className="text-white">Line {rowPendingRemoval.displayIndex + 1}</strong>?
                </p>

                <div className="bg-slate-900/90 border border-slate-700 rounded-xl p-3.5 text-xs text-slate-300 flex flex-wrap gap-3">
                  {!rowPendingRemoval.row.service && !rowPendingRemoval.row.size && !rowPendingRemoval.row.grid && !rowPendingRemoval.row.pPark ? (
                    <span className="text-slate-400 italic">Empty row</span>
                  ) : (
                    <>
                      <span>Service: <strong className="text-blue-400">{rowPendingRemoval.row.service || "--"}</strong></span>
                      <span>•</span>
                      <span>Size: <strong className="text-white">{rowPendingRemoval.row.size || "--"}</strong></span>
                      <span>•</span>
                      <span>Grid: <strong className="text-emerald-400">{rowPendingRemoval.row.grid || "--"}</strong></span>
                      <span>•</span>
                      <span>P Park: <strong className="text-purple-300">{rowPendingRemoval.row.pPark || "--"}</strong></span>
                    </>
                  )}
                </div>

                <div className="flex items-center justify-end gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setRowPendingRemoval(null)}
                    className="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmRemoveLine}
                    className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-semibold shadow-lg transition"
                  >
                    Yes, Remove Line {rowPendingRemoval.displayIndex + 1}
                  </button>
                </div>
              </div>
            </div>
          )}

          <header className="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                Yard Grid Planner
                <span className={`text-xs px-2.5 py-0.5 rounded font-medium ${isSynced ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" : "bg-yellow-500/20 text-yellow-400"}`}>
                  {isSynced ? "Live Multi-User Connected" : "Connecting..."}
                </span>
              </h1>
              <p className="text-sm text-slate-400">{rows.length} Active Container Lines (Drag handle :: to reorder)</p>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button
                  onClick={() => setActiveTab("tracker")}
                  className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === "tracker" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                >
                  Active Tracker
                </button>
                <button
                  onClick={() => {
                    setIsRemoveMode(false);
                    setActiveTab("history");
                  }}
                  className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === "history" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                >
                  Movement Log
                </button>
              </div>

              {/* X Grid Map Toggle Button */}
              <button
                onClick={() => setShowHeaderGridMap(!showHeaderGridMap)}
                className={`px-4 py-2 border text-sm font-medium rounded-lg flex items-center gap-2 transition ${
                  showHeaderGridMap
                    ? "bg-blue-600/20 border-blue-500/60 text-blue-300 shadow-inner"
                    : "bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200"
                }`}
              >
                <span>🗺️ X Grid Map</span>
                <span className="text-xs text-slate-400">{showHeaderGridMap ? "▲" : "▼"}</span>
              </button>

              {/* Controls Dropdown Menu */}
              <div className="relative" ref={dropdownRef}>
                <button
                  onClick={() => setShowControlsMenu(!showControlsMenu)}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium rounded-lg text-slate-200 flex items-center gap-2 transition"
                >
                  <span>⚙️ Controls</span>
                  <span className="text-xs text-slate-400">▼</span>
                </button>

                {showControlsMenu && (
                  <div className="absolute right-0 mt-2 w-60 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden py-1">
                    <button
                      onClick={() => {
                        openExportDrawer();
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-emerald-400 hover:bg-slate-700/60 flex items-center gap-2 border-b border-slate-700/50 font-medium"
                    >
                      <span>📊</span> Export to Excel
                    </button>
                    <button
                      onClick={() => {
                        openNotificationEditor();
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-amber-400 hover:bg-slate-700/60 flex items-center gap-2 border-b border-slate-700/50 font-medium"
                    >
                      <span>📢</span> {notificationText ? "Edit Notification" : "Add Notification"}
                    </button>
                    <button
                      onClick={addRow}
                      className="w-full text-left px-4 py-2.5 text-sm text-emerald-400 hover:bg-slate-700/60 flex items-center gap-2"
                    >
                      <span>➕</span> Add Line
                    </button>
                    <button
                      onClick={startRemoveLineMode}
                      disabled={rows.length <= 1}
                      className="w-full text-left px-4 py-2.5 text-sm text-red-400 hover:bg-slate-700/60 disabled:opacity-40 flex items-center gap-2 border-b border-slate-700/50"
                    >
                      <span>➖</span> Remove Line
                    </button>
                    <button
                      onClick={() => {
                        const nextState = !showManageDedicated;
                        closeAllDrawers();
                        setShowManageDedicated(nextState);
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-cyan-400 hover:bg-slate-700/60 flex items-center gap-2 border-b border-slate-700/50"
                    >
                      <span>🎯</span> Dedicated Service Grids
                    </button>
                    <button
                      onClick={() => {
                        const nextState = !showManageZones;
                        closeAllDrawers();
                        setShowManageZones(nextState);
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-purple-400 hover:bg-slate-700/60 flex items-center gap-2 border-b border-slate-700/50"
                    >
                      <span>📍</span> Manage Grid Zones
                    </button>
                    <button
                      onClick={() => {
                        const nextState = !showManageServices;
                        closeAllDrawers();
                        setShowManageServices(nextState);
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-blue-400 hover:bg-slate-700/60 flex items-center gap-2"
                    >
                      <span>🏷️</span> Manage Services
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Manage Dedicated Service Grids Drawer */}
          {showManageDedicated && (
            <div className="max-w-7xl mx-auto mb-6 bg-slate-800 border border-cyan-500/40 p-5 rounded-xl shadow-xl">
              <div className="flex justify-between items-center mb-3">
                <div>
                  <h3 className="text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                    <span>🎯</span> Dedicated X-Grids by Service
                  </h3>
                  <p className="text-xs text-slate-400 mt-0.5">Assign dedicated grids to specific services & sizes (operators can override on any row)</p>
                </div>

                                disabled={isRemoveMode}
                                placeholder="Select or Type (P1-P11)"
                                value={row.pPark}
                                onChange={(e) => handleRowInputChange(row.id, "pPark", e.target.value)}
                                onBlur={(e) => handleCommitRowChange(row.id, "pPark", e.target.value)}
                                className={`w-full bg-slate-900 border border-slate-700 text-white font-semibold text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none ${isRemoveMode ? "pointer-events-none" : ""}`}
                              />
                            </td>
                            <td className="py-3 px-4 align-top pt-4 text-xs text-slate-400 font-mono">{formatTo24Hour(row.lastUpdated)}</td>
                            
                            {/* ACTION COLUMN */}
                            <td className="py-3 px-4 align-top pt-3.5 text-right relative" ref={actionMenuRef}>
                              {isRemoveMode ? (
                                <span className="inline-block text-red-300 group-hover:text-white bg-red-600/30 group-hover:bg-red-600 border border-red-500/50 text-xs font-semibold px-2.5 py-1.5 rounded-md transition">
                                  Select to Remove
                                </span>
                              ) : (
                                <div className="inline-flex items-center gap-1.5">
                                  {row.trainBlocked && (
                                    <span className="hidden xl:inline-block text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-1 rounded">
                                      🛑 Blocked
                                    </span>
                                  )}

                                  <div className="relative">
                                    <button
                                      type="button"
                                      onClick={() => setOpenActionRowId(isActionMenuOpen ? null : row.id)}
                                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold border flex items-center gap-1.5 transition ${
                                        row.trainBlocked
                                          ? "bg-amber-500/20 border-amber-500/60 text-amber-300"
                                          : "bg-slate-900 hover:bg-slate-800 border-slate-700 text-slate-300"
                                      }`}
                                    >
                                      <span>⚙️ Actions</span>
                                      <span className="text-[9px]">▼</span>
                                    </button>

                                    {isActionMenuOpen && (
                                      <div className="absolute right-0 top-10 mt-1 w-52 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 p-1.5 space-y-1 text-left">
                                        <button
                                          type="button"
                                          onClick={() => handleOpenTrainBlockModal(row)}
                                          className={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                                            row.trainBlocked
                                              ? "bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25 border border-emerald-500/30"
                                              : "bg-amber-500/15 text-amber-300 hover:bg-amber-500/25 border border-amber-500/30"
                                          }`}
                                        >
                                          <span>{row.trainBlocked ? "✅ Unblock Grid" : "🛑 Block Grid for Train"}</span>
                                        </button>

                                        <button
                                          type="button"
                                          onClick={() => clearRow(row.id)}
                                          disabled={!row.service && !row.size && !row.grid && !row.pPark}
                                          className="w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-red-400 hover:bg-red-500/20 disabled:opacity-30 flex items-center gap-2 transition"
                                        >
                                          <span>🗑️ Clear Line</span>
                                        </button>
                                      </div>
                                    )}
                                  </div>
                                </div>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {activeTab === "history" && (
            <main className="max-w-7xl mx-auto bg-slate-800/80 rounded-xl border border-slate-700 p-5 space-y-4 shadow-2xl">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-700/80 pb-4">
                <div>
                  <h2 className="text-lg font-semibold text-white">Previous Moves & History</h2>
                  <p className="text-xs text-slate-400">Search log entries by Service code, Grid, or Action</p>
                </div>
                
                <div className="relative w-full sm:w-72">
                  <input
                    type="text"
                    value={logSearchQuery}
                    onChange={(e) => setLogSearchQuery(e.target.value)}
                    placeholder="Search by Service (e.g. 120, CMA)..."
                    className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg pl-9 pr-8 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder-slate-500"
                  />
                  <span className="absolute left-3 top-2.5 text-slate-500 text-sm">🔍</span>
                  {logSearchQuery && (
                    <button
                      onClick={() => setLogSearchQuery("")}
                      className="absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs bg-slate-800 rounded-full w-5 h-5 flex items-center justify-center"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              <div className="space-y-2">
                {filteredHistory.length === 0 ? (
                  <p className="text-slate-500 text-sm py-4 text-center">
                    {logSearchQuery ? `No movement entries found matching "${logSearchQuery}".` : "No recent activity."}
                  </p>
                ) : (
                  filteredHistory.map((log) => (
                    <div key={log.id} className="bg-slate-900 border border-slate-700/80 rounded-lg p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-sm hover:border-slate-600 transition">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded text-xs font-semibold">
                          Service: {log.service || "--"}
                        </span>
                        <span className="text-slate-300">Size: <strong className="text-slate-100">{log.size || "--"}</strong></span>
                        <span className="text-slate-400 font-mono text-xs">|</span>
                        <span className="text-blue-400 font-bold">Grid: {log.grid || "--"}</span>
                      </div>
                      <div className="text-slate-400 text-xs flex items-center gap-2">
                        <span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">{log.action}</span>
                        <span>•</span>
                        <span>{formatTo24Hour(log.timestamp)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
