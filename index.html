<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yard Grid Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Your Live Singapore Firebase Database URL
    const FIREBASE_DB_URL = "https://yard-tracker-2ac18-default-rtdb.asia-southeast1.firebasedatabase.app/";

    // Initialize Firebase
    if (!firebase.apps.length && FIREBASE_DB_URL !== "YOUR_DATABASE_URL_HERE") {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
    }

    // Grid Options: X1-X42, TF1-TF7, T1-T4
    const GRID_X_OPTIONS = [
      ...Array.from({ length: 42 }, (_, i) => `X${i + 1}`),
      ...Array.from({ length: 7 }, (_, i) => `TF${i + 1}`),
      ...Array.from({ length: 4 }, (_, i) => `T${i + 1}`)
    ];

    const P_PARK_OPTIONS = Array.from({ length: 11 }, (_, i) => `P${i + 1}`);
    const DEFAULT_SERVICES = ["120", "192", "194", "CMA", "225"];
    const SIZES = ["20ft", "40ft"];

    const INITIAL_ROWS = Array.from({ length: 12 }, (_, index) => ({
      id: index + 1,
      service: "",
      size: "",
      grid: "",
      pPark: "",
      lastUpdated: ""
    }));

    // Helper: Convert any date or timestamp string to 4-Digit 24-Hour format (e.g., "Nov 11, 1300")
    const formatTo24Hour = (timeStr) => {
      if (!timeStr) return "--";

      if (/^[A-Za-z]{3}\s+\d{1,2},\s+\d{4}$/.test(timeStr)) {
        return timeStr;
      }
      
      const legacyMatch = timeStr.match(/^([A-Za-z]+\s+\d+),\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (legacyMatch) {
        const [, datePart, rawH, min, ampm] = legacyMatch;
        let h = parseInt(rawH, 10);
        if (ampm.toUpperCase() === "PM" && h < 12) h += 12;
        if (ampm.toUpperCase() === "AM" && h === 12) h = 0;
        const hh = String(h).padStart(2, "0");
        return `${datePart}, ${hh}${min}`;
      }

      const parsedDate = new Date(timeStr);
      if (!isNaN(parsedDate.getTime())) {
        const month = parsedDate.toLocaleString("en-US", { month: "short" });
        const day = parsedDate.getDate();
        const hours = String(parsedDate.getHours()).padStart(2, "0");
        const minutes = String(parsedDate.getMinutes()).padStart(2, "0");
        return `${month} ${day}, ${hours}${minutes}`;
      }

      return timeStr;
    };

    const getCurrent24HourTimestamp = () => {
      const now = new Date();
      const month = now.toLocaleString("en-US", { month: "short" });
      const day = now.getDate();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      return `${month} ${day}, ${hours}${minutes}`;
    };

    function App() {
      const [activeTab, setActiveTab] = useState("tracker");
      const [rows, setRows] = useState(INITIAL_ROWS);
      const [services, setServices] = useState(DEFAULT_SERVICES);
      const [history, setHistory] = useState([]);
      const [isSynced, setIsSynced] = useState(false);

      // Notification State
      const [notificationText, setNotificationText] = useState("");
      const [showNotificationEditor, setShowNotificationEditor] = useState(false);
      const [notificationInput, setNotificationInput] = useState("");

      // Export State
      const [showExportDrawer, setShowExportDrawer] = useState(false);
      const [selectedServicesForExport, setSelectedServicesForExport] = useState([]);

      // Drag and drop state
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      // Controls Dropdown & Manage Services States
      const [showControlsMenu, setShowControlsMenu] = useState(false);
      const [showManageServices, setShowManageServices] = useState(false);
      const [newServiceInput, setNewServiceInput] = useState("");
      const [editingServiceIndex, setEditingServiceIndex] = useState(null);
      const [editServiceInput, setEditServiceInput] = useState("");

      // Movement Log Search State
      const [logSearchQuery, setLogSearchQuery] = useState("");

      const dropdownRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setShowControlsMenu(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      // Live Sync with Firebase
      useEffect(() => {
        if (!FIREBASE_DB_URL) return;
        const db = firebase.database();

        const rowsRef = db.ref("yard_rows");
        rowsRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setRows(data);
          setIsSynced(true);
        });

        const servicesRef = db.ref("yard_services");
        servicesRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setServices(data);
        });

        const historyRef = db.ref("yard_history");
        historyRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setHistory(Object.values(data).reverse());
        });

        const notificationRef = db.ref("yard_notification");
        notificationRef.on("value", (snapshot) => {
          const val = snapshot.val();
          setNotificationText(val || "");
        });

        return () => {
          rowsRef.off();
          servicesRef.off();
          historyRef.off();
          notificationRef.off();
        };
      }, []);

      const saveRowsToFirebase = (newRows) => {
        const reindexedRows = newRows.map((r, i) => ({ ...r, id: i + 1 }));
        setRows(reindexedRows);
        firebase.database().ref("yard_rows").set(reindexedRows);
      };

      const handleRowInputChange = (id, field, value) => {
        const formattedValue = (field === "grid" || field === "pPark") ? value.toUpperCase() : value;
        const updatedRows = rows.map(row => row.id === id ? { ...row, [field]: formattedValue } : row);
        setRows(updatedRows);
      };

      const handleCommitRowChange = (id, field, value) => {
        const formattedValue = (field === "grid" || field === "pPark") ? value.toUpperCase() : value;
        const now = getCurrent24HourTimestamp();

        const currentRow = rows.find(r => r.id === id);
        
        const updatedRows = rows.map(row => {
          if (row.id === id) {
            return { ...row, [field]: formattedValue, lastUpdated: now };
          }
          return row;
        });

        saveRowsToFirebase(updatedRows);

        if (field === "service" || field === "size" || field === "grid") {
          const logEntry = {
            id: Date.now(),
            timestamp: now,
            service: field === "service" ? formattedValue : currentRow.service,
            size: field === "size" ? formattedValue : currentRow.size,
            grid: field === "grid" ? formattedValue : currentRow.grid,
            action: `Updated Line ${id} ${field.toUpperCase()} to ${formattedValue || "Empty"}`
          };

          firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);
        }
      };

      const clearRow = (id) => {
        const rowToClear = rows.find(r => r.id === id);
        if (!rowToClear) return;

        const now = getCurrent24HourTimestamp();
        const updatedRows = rows.map(row => row.id === id ? { ...row, service: "", size: "", grid: "", pPark: "", lastUpdated: now } : row);
        
        const logEntry = {
          id: Date.now(),
          timestamp: now,
          service: rowToClear.service,
          size: rowToClear.size,
          grid: rowToClear.grid,
          action: `Cleared Line ${id}`
        };

        firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);
        saveRowsToFirebase(updatedRows);
      };

      // Notification Management
      const openNotificationEditor = () => {
        setNotificationInput(notificationText);
        setShowNotificationEditor(true);
        setShowManageServices(false);
        setShowExportDrawer(false);
      };

      const handleSaveNotification = (e) => {
        e.preventDefault();
        const text = notificationInput.trim();
        firebase.database().ref("yard_notification").set(text);
        setShowNotificationEditor(false);
      };

      const handleClearNotification = () => {
        firebase.database().ref("yard_notification").set("");
        setNotificationInput("");
      };

      // Export to Excel Logic (Excludes # and Last Updated)
      const openExportDrawer = () => {
        setSelectedServicesForExport([...services]);
        setShowExportDrawer(true);
        setShowNotificationEditor(false);
        setShowManageServices(false);
      };

      const toggleExportService = (svc) => {
        if (selectedServicesForExport.includes(svc)) {
          setSelectedServicesForExport(selectedServicesForExport.filter(s => s !== svc));
        } else {
          setSelectedServicesForExport([...selectedServicesForExport, svc]);
        }
      };

      const selectAllExportServices = () => setSelectedServicesForExport([...services]);
      const deselectAllExportServices = () => setSelectedServicesForExport([]);

      const handleExecuteExport = () => {
        const rowsToExport = rows.filter(r => r.service && selectedServicesForExport.includes(r.service));

        if (rowsToExport.length === 0) {
          alert("No matching container rows found for the selected service(s).");
          return;
        }

        // Clean export layout with only Service, Size, Grid, and P Park
        const exportData = rowsToExport.map((row) => ({
          "Service": row.service || "",
          "Size": row.size || "",
          "Grid": row.grid || "",
          "P Park": row.pPark || ""
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        
        // Auto-fit column widths for the remaining 4 columns
        worksheet["!cols"] = [
          { wch: 14 }, // Service
          { wch: 10 }, // Size
          { wch: 14 }, // Grid
          { wch: 14 }  // P Park
        ];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Yard Grid Export");

        const dateStr = new Date().toISOString().slice(0,10);
        const fileName = `Yard_Grid_Export_${dateStr}.xlsx`;

        XLSX.writeFile(workbook, fileName);
        setShowExportDrawer(false);
      };

      // Drag and Drop Logic
      const handleDragStart = (index) => {
        setDraggedIndex(index);
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        if (dragOverIndex !== index) {
          setDragOverIndex(index);
        }
      };

      const handleDrop = (dropIndex) => {
        if (draggedIndex === null || draggedIndex === dropIndex) {
          setDraggedIndex(null);
          setDragOverIndex(null);
          return;
        }

        const updatedRows = [...rows];
        const [movedRow] = updatedRows.splice(draggedIndex, 1);
        updatedRows.splice(dropIndex, 0, movedRow);

        saveRowsToFirebase(updatedRows);

        const now = getCurrent24HourTimestamp();
        const logEntry = {
          id: Date.now(),
          timestamp: now,
          service: movedRow.service,
          size: movedRow.size,
          grid: movedRow.grid,
          action: `Reordered Line to position ${dropIndex + 1}`
        };
        firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);

        setDraggedIndex(null);
        setDragOverIndex(null);
      };

      const getPreviewRows = () => {
        if (draggedIndex === null || dragOverIndex === null || draggedIndex === dragOverIndex) {
          return rows;
        }
        const tempRows = [...rows];
        const [draggedRow] = tempRows.splice(draggedIndex, 1);
        tempRows.splice(dragOverIndex, 0, draggedRow);
        return tempRows;
      };

      const displayRows = getPreviewRows();

      const addRow = () => {
        const nextId = rows.length + 1;
        const newRow = {
          id: nextId,
          service: "",
          size: "",
          grid: "",
          pPark: "",
          lastUpdated: ""
        };
        saveRowsToFirebase([...rows, newRow]);
        setShowControlsMenu(false);
      };

      const removeRow = () => {
        if (rows.length <= 1) return;
        saveRowsToFirebase(rows.slice(0, -1));
        setShowControlsMenu(false);
      };

      const handleAddService = (e) => {
        e.preventDefault();
        if (newServiceInput.trim() && !services.includes(newServiceInput.trim())) {
          const updatedServices = [...services, newServiceInput.trim()];
          setServices(updatedServices);
          firebase.database().ref("yard_services").set(updatedServices);
          setNewServiceInput("");
        }
      };

      const handleStartEditService = (index) => {
        setEditingServiceIndex(index);
        setEditServiceInput(services[index]);
      };

      const handleSaveEditService = (index) => {
        const oldName = services[index];
        const newName = editServiceInput.trim();
        if (!newName || newName === oldName) {
          setEditingServiceIndex(null);
          return;
        }

        const updatedServices = [...services];
        updatedServices[index] = newName;
        setServices(updatedServices);

        firebase.database().ref("yard_services").set(updatedServices);
        setEditingServiceIndex(null);
      };

      const handleDeleteService = (index) => {
        const updatedServices = services.filter((_, i) => i !== index);
        setServices(updatedServices);
        firebase.database().ref("yard_services").set(updatedServices);
      };

      const filteredHistory = history.filter(log => {
        if (!logSearchQuery.trim()) return true;
        const q = logSearchQuery.toLowerCase();
        return (
          (log.service && log.service.toLowerCase().includes(q)) ||
          (log.grid && log.grid.toLowerCase().includes(q)) ||
          (log.action && log.action.toLowerCase().includes(q))
        );
      });

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-6 font-sans">
          <datalist id="grid-x-list">
            {GRID_X_OPTIONS.map(opt => <option key={opt} value={opt} />)}
          </datalist>
          <datalist id="p-park-list">
            {P_PARK_OPTIONS.map(opt => <option key={opt} value={opt} />)}
          </datalist>

          <header className="max-w-6xl mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                Yard Grid Planner
                <span className={`text-xs px-2.5 py-0.5 rounded font-medium ${isSynced ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" : "bg-yellow-500/20 text-yellow-400"}`}>
                  {isSynced ? "Live Multi-User Connected" : "Connecting..."}
                </span>
              </h1>
              <p className="text-sm text-slate-400">{rows.length} Active Container Lines (Drag handle :: to reorder)</p>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button
                  onClick={() => setActiveTab("tracker")}
                  className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === "tracker" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                >
                  Active Tracker
                </button>
                <button
                  onClick={() => setActiveTab("history")}
                  className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === "history" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                >
                  Movement Log
                </button>
              </div>

              {/* Controls Dropdown Menu */}
              <div className="relative" ref={dropdownRef}>
                <button
                  onClick={() => setShowControlsMenu(!showControlsMenu)}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium rounded-lg text-slate-200 flex items-center gap-2 transition"
                >
                  <span>⚙️ Controls</span>
                  <span className="text-xs text-slate-400">▼</span>
                </button>

                {showControlsMenu && (
                  <div className="absolute right-0 mt-2 w-56 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden py-1">
                    <button
                      onClick={() => {
                        openExportDrawer();
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-emerald-400 hover:bg-slate-700/60 flex items-center gap-2 border-b border-slate-700/50 font-medium"
                    >
                      <span>📊</span> Export to Excel
                    </button>
                    <button
                      onClick={() => {
                        openNotificationEditor();
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-amber-400 hover:bg-slate-700/60 flex items-center gap-2 border-b border-slate-700/50 font-medium"
                    >
                      <span>📢</span> {notificationText ? "Edit Notification" : "Add Notification"}
                    </button>
                    <button
                      onClick={addRow}
                      className="w-full text-left px-4 py-2.5 text-sm text-emerald-400 hover:bg-slate-700/60 flex items-center gap-2"
                    >
                      <span>➕</span> Add Line
                    </button>
                    <button
                      onClick={removeRow}
                      disabled={rows.length <= 1}
                      className="w-full text-left px-4 py-2.5 text-sm text-red-400 hover:bg-slate-700/60 disabled:opacity-40 flex items-center gap-2 border-b border-slate-700/50"
                    >
                      <span>➖</span> Remove Line
                    </button>
                    <button
                      onClick={() => {
                        setShowManageServices(!showManageServices);
                        setShowNotificationEditor(false);
                        setShowExportDrawer(false);
                        setShowControlsMenu(false);
                      }}
                      className="w-full text-left px-4 py-2.5 text-sm text-blue-400 hover:bg-slate-700/60 flex items-center gap-2"
                    >
                      <span>🏷️</span> Manage Services
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Export to Excel Drawer */}
          {showExportDrawer && (
            <div className="max-w-6xl mx-auto mb-6 bg-slate-800 border border-emerald-500/40 p-5 rounded-xl shadow-xl">
              <div className="flex justify-between items-center mb-3">
                <h3 className="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                  <span>📊</span> Select Services to Export (.xlsx)
                </h3>
                <button onClick={() => setShowExportDrawer(false)} className="text-slate-400 hover:text-white text-xs">✕ Close</button>
              </div>

              <div className="flex items-center gap-3 mb-4 text-xs">
                <button onClick={selectAllExportServices} className="text-blue-400 hover:underline">Select All</button>
                <span className="text-slate-600">|</span>
                <button onClick={deselectAllExportServices} className="text-slate-400 hover:underline">Deselect All</button>
              </div>

              <div className="flex flex-wrap gap-3 mb-5">
                {services.map((svc) => (
                  <label key={svc} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border text-sm cursor-pointer transition ${selectedServicesForExport.includes(svc) ? "bg-emerald-600/20 border-emerald-500/50 text-emerald-300" : "bg-slate-900 border-slate-700 text-slate-400"}`}>
                    <input
                      type="checkbox"
                      checked={selectedServicesForExport.includes(svc)}
                      onChange={() => toggleExportService(svc)}
                      className="rounded accent-emerald-500"
                    />
                    <span className="font-semibold">{svc}</span>
                  </label>
                ))}
              </div>

              <div className="flex gap-3">
                <button
                  onClick={handleExecuteExport}
                  disabled={selectedServicesForExport.length === 0}
                  className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition"
                >
                  Download Excel File
                </button>
                <button
                  onClick={() => setShowExportDrawer(false)}
                  className="bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium px-4 py-2.5 rounded-lg transition"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* Add / Edit Notification Drawer */}
          {showNotificationEditor && (
            <div className="max-w-6xl mx-auto mb-6 bg-slate-800 border border-amber-500/40 p-5 rounded-xl shadow-xl">
              <div className="flex justify-between items-center mb-3">
                <h3 className="text-sm font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                  <span>📢</span> {notificationText ? "Edit Notification Banner" : "Set Yard Banner Notification"}
                </h3>
                <button onClick={() => setShowNotificationEditor(false)} className="text-slate-400 hover:text-white text-xs">✕ Close</button>
              </div>
              
              <form onSubmit={handleSaveNotification} className="flex gap-3">
                <input
                  type="text"
                  value={notificationInput}
                  onChange={(e) => setNotificationInput(e.target.value)}
                  placeholder="Enter alert message (e.g., 'Grid X12 out of service until 1500')"
                  className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2.5 flex-1 focus:ring-2 focus:ring-amber-500"
                />
                <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white text-sm font-medium px-4 py-2.5 rounded-lg">
                  {notificationText ? "Update Banner" : "Save Banner"}
                </button>
                {notificationText && (
                  <button
                    type="button"
                    onClick={() => {
                      handleClearNotification();
                      setShowNotificationEditor(false);
                    }}
                    className="bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30 text-sm font-medium px-4 py-2.5 rounded-lg"
                  >
                    Clear Banner
                  </button>
                )}
              </form>
            </div>
          )}

          {/* Manage Services Drawer */}
          {showManageServices && (
            <div className="max-w-6xl mx-auto mb-6 bg-slate-800 border border-blue-500/40 p-5 rounded-xl shadow-xl">
              <div className="flex justify-between items-center mb-3">
                <h3 className="text-sm font-bold text-blue-400 uppercase tracking-wider">Manage Services List</h3>
                <button onClick={() => setShowManageServices(false)} className="text-slate-400 hover:text-white text-xs">✕ Close</button>
              </div>
              
              <form onSubmit={handleAddService} className="flex gap-3 mb-4">
                <input
                  type="text"
                  value={newServiceInput}
                  onChange={(e) => setNewServiceInput(e.target.value)}
                  placeholder="Add new service code (e.g. 301, MSC)"
                  className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2.5 flex-1 focus:ring-2 focus:ring-blue-500"
                />
                <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2.5 rounded-lg">
                  + Add
                </button>
              </form>

              <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-700">
                {services.map((svc, idx) => (
                  <div key={idx} className="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-2 text-sm">
                    {editingServiceIndex === idx ? (
                      <div className="flex items-center gap-1">
                        <input
                          type="text"
                          value={editServiceInput}
                          onChange={(e) => setEditServiceInput(e.target.value)}
                          className="bg-slate-800 text-white border border-blue-500 rounded px-2 py-0.5 text-xs"
                        />
                        <button onClick={() => handleSaveEditService(idx)} className="text-emerald-400 text-xs font-bold px-1">Save</button>
                        <button onClick={() => setEditingServiceIndex(null)} className="text-slate-400 text-xs px-1">Cancel</button>
                      </div>
                    ) : (
                      <>
                        <span className="font-semibold text-slate-200">{svc}</span>
                        <button onClick={() => handleStartEditService(idx)} className="text-slate-400 hover:text-blue-400 text-xs ml-1">✏️</button>
                        <button onClick={() => handleDeleteService(idx)} className="text-slate-500 hover:text-red-400 text-xs">✕</button>
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ACTIVE TRACKER TAB */}
          {activeTab === "tracker" && (
            <main className="max-w-6xl mx-auto space-y-4">
              {/* Full-Width Stretching Notification Banner */}
              {notificationText && (
                <div className="w-full bg-gradient-to-r from-amber-500/20 via-amber-500/10 to-amber-500/20 border border-amber-500/40 rounded-xl p-4 flex items-center justify-between gap-3 shadow-lg">
                  <div className="flex items-center gap-3">
                    <span className="relative flex h-3 w-3 shrink-0">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                    </span>
                    <span className="text-amber-300 font-medium text-sm md:text-base">{notificationText}</span>
                  </div>
                  
                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      onClick={openNotificationEditor}
                      className="text-amber-300 hover:text-white bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/30 px-2.5 py-1 rounded-md text-xs font-semibold transition"
                      title="Edit active notification message"
                    >
                      ✏️ Edit
                    </button>
                    <button
                      onClick={handleClearNotification}
                      className="text-red-400 hover:text-white bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 px-2.5 py-1 rounded-md text-xs font-semibold transition"
                      title="Remove notification banner for everyone"
                    >
                      ✕ Remove
                    </button>
                  </div>
                </div>
              )}

              {/* Grid Table Container */}
              <div className="bg-slate-800/80 rounded-xl border border-slate-700 overflow-hidden shadow-2xl">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                        <th className="py-3.5 px-4 w-16 text-center">#</th>
                        <th className="py-3.5 px-4">Service</th>
                        <th className="py-3.5 px-4">Size</th>
                        <th className="py-3.5 px-4">Grid</th>
                        <th className="py-3.5 px-4">P Park</th>
                        <th className="py-3.5 px-4">Last Updated</th>
                        <th className="py-3.5 px-4 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700/50">
                      {displayRows.map((row, index) => {
                        const isOriginalDragged = draggedIndex === rows.findIndex(r => r.id === row.id);
                        const isHoverTarget = dragOverIndex === index;

                        return (
                          <tr
                            key={row.id}
                            draggable
                            onDragStart={() => handleDragStart(rows.findIndex(r => r.id === row.id))}
                            onDragOver={(e) => handleDragOver(e, index)}
                            onDrop={() => handleDrop(index)}
                            className={`transition-all duration-150 ${
                              isOriginalDragged
                                ? "opacity-40 bg-blue-900/30 border-2 border-dashed border-blue-500"
                                : isHoverTarget
                                ? "bg-blue-600/20 border-t-2 border-blue-400"
                                : "hover:bg-slate-700/30"
                            }`}
                          >
                            <td className="py-3 px-4 text-slate-500 text-center text-xs font-mono flex items-center justify-center gap-1 cursor-grab active:cursor-grabbing">
                              <span className="text-slate-400 font-bold hover:text-blue-400 text-sm tracking-tighter">⋮⋮</span>
                              <span>{index + 1}</span>
                            </td>
                            <td className="py-3 px-4">
                              <select
                                value={row.service}
                                onChange={(e) => handleCommitRowChange(row.id, "service", e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                              >
                                <option value="">-- Select --</option>
                                {services.map((svc) => <option key={svc} value={svc}>{svc}</option>)}
                              </select>
                            </td>
                            <td className="py-3 px-4">
                              <select
                                value={row.size}
                                onChange={(e) => handleCommitRowChange(row.id, "size", e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                              >
                                <option value="">-- Select --</option>
                                {SIZES.map((s) => <option key={s} value={s}>{s}</option>)}
                              </select>
                            </td>
                            <td className="py-3 px-4">
                              <input
                                type="text"
                                list="grid-x-list"
                                placeholder="Select or Type (X1, TF1, T1)"
                                value={row.grid}
                                onChange={(e) => handleRowInputChange(row.id, "grid", e.target.value)}
                                onBlur={(e) => handleCommitRowChange(row.id, "grid", e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 text-white font-semibold text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                              />
                            </td>
                            <td className="py-3 px-4">
                              <input
                                type="text"
                                list="p-park-list"
                                placeholder="Select or Type (P1-P11)"
                                value={row.pPark}
                                onChange={(e) => handleRowInputChange(row.id, "pPark", e.target.value)}
                                onBlur={(e) => handleCommitRowChange(row.id, "pPark", e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 text-white font-semibold text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                              />
                            </td>
                            <td className="py-3 px-4 text-xs text-slate-400 font-mono">{formatTo24Hour(row.lastUpdated)}</td>
                            <td className="py-3 px-4 text-right">
                              <button
                                onClick={() => clearRow(row.id)}
                                disabled={!row.service && !row.size && !row.grid && !row.pPark}
                                className="text-red-400 text-xs px-2.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 rounded-md disabled:opacity-30 transition"
                              >
                                Clear
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {activeTab === "history" && (
            <main className="max-w-6xl mx-auto bg-slate-800/80 rounded-xl border border-slate-700 p-5 space-y-4 shadow-2xl">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-700/80 pb-4">
                <div>
                  <h2 className="text-lg font-semibold text-white">Previous Moves & History</h2>
                  <p className="text-xs text-slate-400">Search log entries by Service code, Grid, or Action</p>
                </div>
                
                <div className="relative w-full sm:w-72">
                  <input
                    type="text"
                    value={logSearchQuery}
                    onChange={(e) => setLogSearchQuery(e.target.value)}
                    placeholder="Search by Service (e.g. 120, CMA)..."
                    className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg pl-9 pr-8 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder-slate-500"
                  />
                  <span className="absolute left-3 top-2.5 text-slate-500 text-sm">🔍</span>
                  {logSearchQuery && (
                    <button
                      onClick={() => setLogSearchQuery("")}
                      className="absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs bg-slate-800 rounded-full w-5 h-5 flex items-center justify-center"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              <div className="space-y-2">
                {filteredHistory.length === 0 ? (
                  <p className="text-slate-500 text-sm py-4 text-center">
                    {logSearchQuery ? `No movement entries found matching "${logSearchQuery}".` : "No recent activity."}
                  </p>
                ) : (
                  filteredHistory.map((log) => (
                    <div key={log.id} className="bg-slate-900 border border-slate-700/80 rounded-lg p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-sm hover:border-slate-600 transition">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded text-xs font-semibold">
                          Service: {log.service || "--"}
                        </span>
                        <span className="text-slate-300">Size: <strong className="text-slate-100">{log.size || "--"}</strong></span>
                        <span className="text-slate-400 font-mono text-xs">|</span>
                        <span className="text-blue-400 font-bold">Grid: {log.grid || "--"}</span>
                      </div>
                      <div className="text-slate-400 text-xs flex items-center gap-2">
                        <span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">{log.action}</span>
                        <span>•</span>
                        <span>{formatTo24Hour(log.timestamp)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
