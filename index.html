<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yard Grid Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Your Live Singapore Firebase Database URL
    const FIREBASE_DB_URL = "https://yard-tracker-2ac18-default-rtdb.asia-southeast1.firebasedatabase.app/";

    // Initialize Firebase
    if (!firebase.apps.length && FIREBASE_DB_URL !== "YOUR_DATABASE_URL_HERE") {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
    }

    // Grid Options: X1-X42, TF1-TF7, T1-T4
    const GRID_X_OPTIONS = [
      ...Array.from({ length: 42 }, (_, i) => `X${i + 1}`),
      ...Array.from({ length: 7 }, (_, i) => `TF${i + 1}`),
      ...Array.from({ length: 4 }, (_, i) => `T${i + 1}`)
    ];

    const P_PARK_OPTIONS = Array.from({ length: 11 }, (_, i) => `P${i + 1}`);
    const DEFAULT_SERVICES = ["120", "192", "194", "CMA", "225"];
    const SIZES = ["20ft", "40ft"];

    const INITIAL_ROWS = Array.from({ length: 12 }, (_, index) => ({
      id: index + 1,
      service: "",
      size: "",
      grid: "",
      pPark: "",
      lastUpdated: ""
    }));

    function App() {
      const [activeTab, setActiveTab] = useState("tracker");
      const [rows, setRows] = useState(INITIAL_ROWS);
      const [services, setServices] = useState(DEFAULT_SERVICES);
      const [history, setHistory] = useState([]);
      const [isSynced, setIsSynced] = useState(false);

      const [newServiceInput, setNewServiceInput] = useState("");
      const [showManageServices, setShowManageServices] = useState(false);
      const [editingServiceIndex, setEditingServiceIndex] = useState(null);
      const [editServiceInput, setEditServiceInput] = useState("");

      // Live Sync with Firebase
      useEffect(() => {
        if (!FIREBASE_DB_URL) return;
        const db = firebase.database();

        // Listen for live row changes across all computers
        const rowsRef = db.ref("yard_rows");
        rowsRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setRows(data);
          setIsSynced(true);
        });

        // Listen for live service code updates
        const servicesRef = db.ref("yard_services");
        servicesRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setServices(data);
        });

        // Listen for live movement history logs
        const historyRef = db.ref("yard_history");
        historyRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setHistory(Object.values(data).reverse());
        });

        return () => {
          rowsRef.off();
          servicesRef.off();
          historyRef.off();
        };
      }, []);

      const saveRowsToFirebase = (newRows) => {
        setRows(newRows);
        firebase.database().ref("yard_rows").set(newRows);
      };

      const handleRowChange = (id, field, value) => {
        const formattedValue = (field === "grid" || field === "pPark") ? value.toUpperCase() : value;
        const now = new Date().toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

        const updatedRows = rows.map(row => {
          if (row.id === id) {
            const updatedRow = { ...row, [field]: formattedValue, lastUpdated: now };
            
            const logEntry = {
              id: Date.now(),
              timestamp: now,
              service: field === "service" ? formattedValue : row.service,
              size: field === "size" ? formattedValue : row.size,
              grid: field === "grid" ? formattedValue : row.grid,
              pPark: field === "pPark" ? formattedValue : row.pPark,
              action: `Updated Line ${id} ${field.toUpperCase()} to ${formattedValue || "Empty"}`
            };

            firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);

            return updatedRow;
          }
          return row;
        });

        saveRowsToFirebase(updatedRows);
      };

      const clearRow = (id) => {
        const rowToClear = rows.find(r => r.id === id);
        if (!rowToClear) return;

        const now = new Date().toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        const updatedRows = rows.map(row => row.id === id ? { ...row, service: "", size: "", grid: "", pPark: "", lastUpdated: now } : row);
        
        const logEntry = {
          id: Date.now(),
          timestamp: now,
          service: rowToClear.service,
          size: rowToClear.size,
          grid: rowToClear.grid,
          pPark: rowToClear.pPark,
          action: `Cleared Line ${id}`
        };

        firebase.database().ref("yard_history/" + logEntry.id).set(logEntry);

        saveRowsToFirebase(updatedRows);
      };

      // Add a new line to the bottom
      const addRow = () => {
        const nextId = rows.length + 1;
        const newRow = {
          id: nextId,
          service: "",
          size: "",
          grid: "",
          pPark: "",
          lastUpdated: ""
        };
        const updatedRows = [...rows, newRow];
        saveRowsToFirebase(updatedRows);
      };

      // Remove the last line from the bottom
      const removeRow = () => {
        if (rows.length <= 1) return; // Keep at least 1 row
        const updatedRows = rows.slice(0, -1);
        saveRowsToFirebase(updatedRows);
      };

      const handleAddService = (e) => {
        e.preventDefault();
        if (newServiceInput.trim() && !services.includes(newServiceInput.trim())) {
          const updatedServices = [...services, newServiceInput.trim()];
          setServices(updatedServices);
          firebase.database().ref("yard_services").set(updatedServices);
          setNewServiceInput("");
        }
      };

      const handleStartEditService = (index) => {
        setEditingServiceIndex(index);
        setEditServiceInput(services[index]);
      };

      const handleSaveEditService = (index) => {
        const oldName = services[index];
        const newName = editServiceInput.trim();
        if (!newName || newName === oldName) {
          setEditingServiceIndex(null);
          return;
        }

        const updatedServices = [...services];
        updatedServices[index] = newName;
        setServices(updatedServices);

        firebase.database().ref("yard_services").set(updatedServices);
        setEditingServiceIndex(null);
      };

      const handleDeleteService = (index) => {
        const updatedServices = services.filter((_, i) => i !== index);
        setServices(updatedServices);
        firebase.database().ref("yard_services").set(updatedServices);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-6 font-sans">
          <datalist id="grid-x-list">
            {GRID_X_OPTIONS.map(opt => <option key={opt} value={opt} />)}
          </datalist>
          <datalist id="p-park-list">
            {P_PARK_OPTIONS.map(opt => <option key={opt} value={opt} />)}
          </datalist>

          <header className="max-w-6xl mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                Yard Grid Planner
                <span className={`text-xs px-2.5 py-0.5 rounded font-medium ${isSynced ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" : "bg-yellow-500/20 text-yellow-400"}`}>
                  {isSynced ? "Live Multi-User Connected" : "Connecting..."}
                </span>
              </h1>
              <p className="text-sm text-slate-400">{rows.length} Active Container Lines</p>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button
                  onClick={() => setActiveTab("tracker")}
                  className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === "tracker" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                >
                  Active Tracker
                </button>
                <button
                  onClick={() => setActiveTab("history")}
                  className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === "history" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                >
                  Movement Log
                </button>
              </div>
              
              {/* Row Management Buttons */}
              <div className="flex gap-1.5">
                <button
                  onClick={addRow}
                  className="px-3 py-2 bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 hover:bg-emerald-600/30 text-sm font-medium rounded-lg transition"
                  title="Add Line to bottom"
                >
                  + Add Line
                </button>
                <button
                  onClick={removeRow}
                  disabled={rows.length <= 1}
                  className="px-3 py-2 bg-red-600/20 border border-red-500/40 text-red-400 hover:bg-red-600/30 text-sm font-medium rounded-lg disabled:opacity-30 transition"
                  title="Remove bottom Line"
                >
                  - Remove Line
                </button>
              </div>

              <button
                onClick={() => setShowManageServices(!showManageServices)}
                className="px-3 py-2 bg-slate-800 border border-slate-700 text-sm font-medium rounded-lg text-blue-400 hover:bg-slate-700"
              >
                ⚙️ Manage Services
              </button>
            </div>
          </header>

          {showManageServices && (
            <div className="max-w-6xl mx-auto mb-6 bg-slate-800 border border-blue-500/40 p-5 rounded-xl shadow-xl">
              <h3 className="text-sm font-bold text-blue-400 uppercase tracking-wider mb-3">Manage Services List</h3>
              
              <form onSubmit={handleAddService} className="flex gap-3 mb-4">
                <input
                  type="text"
                  value={newServiceInput}
                  onChange={(e) => setNewServiceInput(e.target.value)}
                  placeholder="Add new service code (e.g. 301, MSC)"
                  className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2.5 flex-1 focus:ring-2 focus:ring-blue-500"
                />
                <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2.5 rounded-lg">
                  + Add
                </button>
              </form>

              <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-700">
                {services.map((svc, idx) => (
                  <div key={idx} className="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-2 text-sm">
                    {editingServiceIndex === idx ? (
                      <div className="flex items-center gap-1">
                        <input
                          type="text"
                          value={editServiceInput}
                          onChange={(e) => setEditServiceInput(e.target.value)}
                          className="bg-slate-800 text-white border border-blue-500 rounded px-2 py-0.5 text-xs"
                        />
                        <button onClick={() => handleSaveEditService(idx)} className="text-emerald-400 text-xs font-bold px-1">Save</button>
                        <button onClick={() => setEditingServiceIndex(null)} className="text-slate-400 text-xs px-1">Cancel</button>
                      </div>
                    ) : (
                      <>
                        <span className="font-semibold text-slate-200">{svc}</span>
                        <button onClick={() => handleStartEditService(idx)} className="text-slate-400 hover:text-blue-400 text-xs ml-1">✏️</button>
                        <button onClick={() => handleDeleteService(idx)} className="text-slate-500 hover:text-red-400 text-xs">✕</button>
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeTab === "tracker" && (
            <main className="max-w-6xl mx-auto bg-slate-800/80 rounded-xl border border-slate-700 overflow-hidden shadow-2xl">
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr className="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                      <th className="py-3.5 px-4 w-12 text-center">#</th>
                      <th className="py-3.5 px-4">Service</th>
                      <th className="py-3.5 px-4">Size</th>
                      <th className="py-3.5 px-4">Grid</th>
                      <th className="py-3.5 px-4">P Park</th>
                      <th className="py-3.5 px-4">Last Updated</th>
                      <th className="py-3.5 px-4 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50">
                    {rows.map((row) => (
                      <tr key={row.id} className="hover:bg-slate-700/30 transition-colors">
                        <td className="py-3 px-4 text-slate-500 text-center text-xs font-mono">{row.id}</td>
                        <td className="py-3 px-4">
                          <select
                            value={row.service}
                            onChange={(e) => handleRowChange(row.id, "service", e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                          >
                            <option value="">-- Select --</option>
                            {services.map((svc) => <option key={svc} value={svc}>{svc}</option>)}
                          </select>
                        </td>
                        <td className="py-3 px-4">
                          <select
                            value={row.size}
                            onChange={(e) => handleRowChange(row.id, "size", e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                          >
                            <option value="">-- Select --</option>
                            {SIZES.map((s) => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </td>
                        <td className="py-3 px-4">
                          <input
                            type="text"
                            list="grid-x-list"
                            placeholder="Select or Type (X1, TF1, T1)"
                            value={row.grid}
                            onChange={(e) => handleRowChange(row.id, "grid", e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 text-white font-semibold text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                          />
                        </td>
                        <td className="py-3 px-4">
                          <input
                            type="text"
                            list="p-park-list"
                            placeholder="Select or Type (P1-P11)"
                            value={row.pPark}
                            onChange={(e) => handleRowChange(row.id, "pPark", e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 text-white font-semibold text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                          />
                        </td>
                        <td className="py-3 px-4 text-xs text-slate-400 font-mono">{row.lastUpdated || "--"}</td>
                        <td className="py-3 px-4 text-right">
                          <button
                            onClick={() => clearRow(row.id)}
                            disabled={!row.service && !row.size && !row.grid && !row.pPark}
                            className="text-red-400 text-xs px-2.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 rounded-md disabled:opacity-30 transition"
                          >
                            Clear
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </main>
          )}

          {activeTab === "history" && (
            <main className="max-w-6xl mx-auto bg-slate-800/80 rounded-xl border border-slate-700 p-4 space-y-2">
              <h2 className="text-lg font-semibold text-white mb-2">Previous Moves & History</h2>
              {history.length === 0 ? <p className="text-slate-500 text-sm">No recent activity.</p> : history.map((log) => (
                <div key={log.id} className="bg-slate-900 border border-slate-700 rounded p-3 flex justify-between text-sm">
                  <div>
                    <span className="text-slate-300 font-medium">Service: <strong className="text-white">{log.service || "--"}</strong> | Size: {log.size || "--"}</span>
                    <span className="ml-3 text-blue-400 font-bold">Grid: {log.grid || "--"}</span>
                    <span className="ml-3 text-emerald-400 font-bold">P Park: {log.pPark || "--"}</span>
                  </div>
                  <div className="text-slate-400 text-xs">{log.action} - {log.timestamp}</div>
                </div>
              ))}
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
